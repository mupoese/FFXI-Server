name: "Docker Build and Test"

on:
  push:
    branches:
      - main
      - base
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - base
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ffxi-server

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME || 'ffxi-server' }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Validate Docker configuration
        run: |
          echo "Validating Docker configuration files..."
          
          # Check if required files exist
          if [ ! -f "docker/Dockerfile" ]; then
            echo "ERROR: docker/Dockerfile not found!"
            exit 1
          fi
          
          if [ ! -f "docker/Dockerfile.windows" ]; then
            echo "ERROR: docker/Dockerfile.windows not found!"
            exit 1
          fi
          
          if [ ! -f "docker/scripts/entrypoint.sh" ]; then
            echo "ERROR: docker/scripts/entrypoint.sh not found!"
            exit 1
          fi
          
          if [ ! -f "docker/scripts/entrypoint.ps1" ]; then
            echo "ERROR: docker/scripts/entrypoint.ps1 not found!"
            exit 1
          fi
          
          if [ ! -f "docker/supervisord.conf" ]; then
            echo "ERROR: docker/supervisord.conf not found!"
            exit 1
          fi
          
          if [ ! -f "docker-compose.yml" ]; then
            echo "ERROR: docker-compose.yml not found!"
            exit 1
          fi
          
          if [ ! -f ".env.example" ]; then
            echo "ERROR: .env.example not found!"
            exit 1
          fi
          
          # Validate docker-compose syntax
          docker-compose config -q || {
            echo "ERROR: docker-compose.yml syntax validation failed!"
            exit 1
          }
          
          # Check for required environment variables in .env.example
          required_vars=("MYSQL_ROOT_PASSWORD" "MYSQL_DATABASE" "MYSQL_USER" "MYSQL_PASSWORD")
          for var in "${required_vars[@]}"; do
            if ! grep -q "^${var}=" .env.example; then
              echo "ERROR: Required environment variable $var not found in .env.example!"
              exit 1
            fi
          done
          
          echo "Docker configuration validation passed!"

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate SBOM
        if: github.event_name != 'pull_request' && vars.DOCKER_USERNAME != ''
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME || 'ffxi-server' }}/${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan Docker image for vulnerabilities
        if: github.event_name != 'pull_request' && vars.DOCKER_USERNAME != ''
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME || 'ffxi-server' }}/${{ env.IMAGE_NAME }}:latest
          fail-build: false
          severity-cutoff: high

      - name: Upload SBOM and scan results
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            sbom.spdx.json
            anchore-results.sarif
        continue-on-error: true

  # Windows container build job (experimental)
  docker-windows-build:
    runs-on: windows-2022
    if: github.event_name != 'pull_request' && vars.DOCKER_USERNAME != ''
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: vars.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Windows Docker image
        if: vars.DOCKER_USERNAME != ''
        run: |
          docker build -f docker/Dockerfile.windows -t ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME || 'ffxi-server' }}/${{ env.IMAGE_NAME }}:windows-latest .

      - name: Push Windows Docker image
        if: vars.DOCKER_USERNAME != ''
        run: |
          docker push ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME || 'ffxi-server' }}/${{ env.IMAGE_NAME }}:windows-latest

  docker-test:
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Set up test environment
        run: |
          # Create test environment file
          cp .env.example .env
          
          # Override with test-specific values
          cat >> .env << EOF
          MYSQL_ROOT_PASSWORD=test_root_password
          MYSQL_DATABASE=xidb_test
          MYSQL_USER=test_user
          MYSQL_PASSWORD=test_password
          FFXI_DEBUG_MODE=true
          FFXI_LOG_LEVEL=DEBUG
          EOF

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ffxi-server:test
          cache-from: type=gha
          target: runtime-stage

      - name: Test Docker container startup
        run: |
          echo "Starting Docker Compose services..."
          
          # Start database first
          docker-compose up -d db
          
          # Wait for database to be ready
          timeout 120 bash -c '
            until docker-compose exec -T db mysqladmin ping -h localhost --silent; do 
              echo "Waiting for database..."
              sleep 5
            done
          '
          
          echo "Database is ready!"
          
          # Check database logs
          docker-compose logs db
          
          # Test database connection
          docker-compose exec -T db mysql -u root -ptest_root_password -e "SHOW DATABASES;"

      - name: Test FFXI server container
        run: |
          echo "Testing FFXI server container..."
          
          # Test individual server components
          echo "Testing xi_connect..."
          timeout 30 docker run --rm --network container:ffxi-database \
            -e FFXI_SQL_HOST=localhost \
            -e FFXI_SQL_PASSWORD=test_password \
            -e FFXI_SQL_USER=test_user \
            -e FFXI_SQL_DATABASE=xidb_test \
            ffxi-server:test health || echo "Health check timed out (expected in CI)"
          
          echo "Testing database connection from server..."
          docker run --rm --network container:ffxi-database \
            -e FFXI_SQL_HOST=localhost \
            -e FFXI_SQL_PASSWORD=test_root_password \
            -e FFXI_SQL_USER=root \
            -e FFXI_SQL_DATABASE=xidb_test \
            ffxi-server:test /bin/bash -c "
              # Test database connectivity
              mysqladmin ping -h localhost -u root -ptest_root_password --silent
              echo 'Database connection successful!'
              
              # Test binary existence and permissions
              ls -la /opt/ffxi/bin/ || echo 'Binaries directory check'
              
              # Test configuration directory
              ls -la /opt/ffxi/settings/ || echo 'Settings directory check'
              
              # Test entrypoint script
              ls -la /opt/ffxi/entrypoint.sh
              
              # Test Python tools
              ls -la /opt/ffxi/tools/ | head -10
              
              echo 'Container filesystem validation completed'
            "

      - name: Test Docker Compose full stack
        run: |
          echo "Testing full Docker Compose stack..."
          
          # Start all services
          docker-compose up -d
          
          # Wait for services to start
          sleep 30
          
          # Check service status
          docker-compose ps
          
          # Check logs for errors
          echo "=== Database Logs ==="
          docker-compose logs --tail=50 db
          
          echo "=== FFXI Server Logs ==="
          docker-compose logs --tail=50 ffxi-server
          
          # Test health endpoints
          echo "Testing health endpoints..."
          docker-compose exec -T ffxi-server curl -f http://localhost:8088/health || echo "HTTP health check not available yet"

      - name: Test Docker configuration validation
        run: |
          echo "Testing Docker configuration validation..."
          
          # Test different profiles
          profiles=("redis" "admin" "cloudflare" "multi-instance" "monitoring")
          for profile in "${profiles[@]}"; do
            echo "Validating profile: $profile"
            COMPOSE_PROFILES="$profile" docker-compose config -q || {
              echo "ERROR: Profile $profile validation failed!"
              exit 1
            }
          done
          
          echo "All profiles validated successfully!"

      - name: Performance and resource testing
        run: |
          echo "Running performance and resource tests..."
          
          # Monitor resource usage
          docker stats --no-stream || true
          
          # Check disk usage
          docker system df
          
          # Test build cache efficiency
          echo "Testing build cache..."
          time docker build --cache-from ffxi-server:test -f docker/Dockerfile -t ffxi-server:cache-test .
          
          echo "Performance testing completed!"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up test environment..."
          docker-compose down -v
          docker system prune -f
          docker volume prune -f

  docker-security-scan:
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for security scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ffxi-server:security-scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ffxi-server:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Docker security benchmark
        run: |
          echo "Running Docker security benchmark..."
          
          # Check for security best practices
          echo "Checking Dockerfile security..."
          
          # Check if running as non-root user
          if docker run --rm ffxi-server:security-scan whoami | grep -q "ffxi"; then
            echo "✓ Container runs as non-root user"
          else
            echo "⚠ Container should run as non-root user"
            exit 1
          fi
          
          # Check for proper file permissions
          docker run --rm ffxi-server:security-scan ls -la /opt/ffxi/bin/ || echo "Binary permissions check"
          
          # Check for secrets in image
          docker run --rm ffxi-server:security-scan find /opt/ffxi -name "*.key" -o -name "*password*" -o -name "*secret*" | grep -v "example" && {
            echo "⚠ Potential secrets found in image!"
            exit 1
          } || echo "✓ No obvious secrets found"
          
          echo "Security benchmark completed!"

  docker-integration-test:
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Set up integration test environment
        run: |
          cp .env.example .env
          echo "COMPOSE_PROFILES=redis,admin" >> .env

      - name: Run integration tests
        run: |
          echo "Running Docker integration tests..."
          
          # Start full stack with profiles
          COMPOSE_PROFILES=redis,admin docker-compose up -d
          
          # Wait for all services
          sleep 60
          
          # Test service interconnectivity
          echo "Testing service connectivity..."
          
          # Test database to server connection
          docker-compose exec -T db mysql -u root -pxiserver_root_2024 -e "SELECT 1;" || {
            echo "Database connectivity test failed!"
            exit 1
          }
          
          # Test Redis connection (if profile enabled)
          docker-compose exec -T redis redis-cli ping || echo "Redis not available"
          
          # Test PhpMyAdmin (if profile enabled)
          curl -f http://localhost:8080 || echo "PhpMyAdmin not available"
          
          # Test server HTTP endpoint
          curl -f http://localhost:8088/health || echo "Server HTTP endpoint not available"
          
          echo "Integration tests completed!"
          
          # Show final status
          docker-compose ps
          
        env:
          COMPOSE_PROFILES: redis,admin

      - name: Cleanup integration test
        if: always()
        run: |
          docker-compose down -v
          docker system prune -f