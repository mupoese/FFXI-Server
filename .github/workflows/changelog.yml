name: "changelog"

on:
  schedule:
    # At 12:00 on day-of-month 1 and 15.
    - cron:  '0 12 1,15 * *'
  workflow_dispatch:

jobs:
  Publish_Changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: fregante/setup-git-user@v2
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3
        pip3 install requests
    - name: Generate changelog
      run: |
          # Generate changelog using the LandSandBoat format for MupoEse Server
          python3 tools/generate_changelog.py ci ${{ github.repository }} "MupoEse Server"
          cat changelog-$(date +'%Y-%m-%d').md
    - name: Capture date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    - name: Copy changelog to changelogs folder
      run: |
          mkdir -p changelogs
          cp changelog-${{ steps.date.outputs.date }}.md changelogs/
    - name: Git stage changes
      run: |
          git add changelogs/changelog-${{ steps.date.outputs.date }}.md
    - name: Git commit changes
      run: |
          git commit -m "Add changelog-${{ steps.date.outputs.date }}.md"
    - name: Git push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        force: false
