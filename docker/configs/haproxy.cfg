# HAProxy Configuration for FFXI Server Load Balancing
# Handles high-load scenarios with multiple FFXI server instances

global
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # SSL/TLS configuration
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:RSA+AESGCM:RSA+SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 8192

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout tunnel 1h
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# HAProxy Statistics Interface
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats auth admin:${HAPROXY_STATS_PASSWORD:-haproxy123}

# Health Check for API
listen api-health
    bind *:8405
    mode http
    option httpchk GET /health
    http-check expect status 200

#=============================================================================
# FFXI Server Load Balancing Configuration
#=============================================================================

# FFXI Login View Port (54001) - Round Robin with Health Checks
frontend ffxi_login_view_frontend
    bind *:54001
    mode tcp
    option tcplog
    default_backend ffxi_login_view_backend

backend ffxi_login_view_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect port 54011
    
    server ffxi-server-1 ffxi-server-1:54011 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:54021 check inter 5s fall 3 rise 2 weight 100 backup
    server ffxi-server-3 ffxi-server-3:54031 check inter 5s fall 3 rise 2 weight 100 backup

# FFXI Login Data Port (54230) - Persistent sessions for UDP compatibility
frontend ffxi_login_data_frontend
    bind *:54230
    mode tcp
    option tcplog
    default_backend ffxi_login_data_backend

backend ffxi_login_data_backend
    mode tcp
    balance source
    hash-type consistent
    option tcp-check
    tcp-check connect port 54240
    
    server ffxi-server-1 ffxi-server-1:54240 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:54250 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-3 ffxi-server-3:54260 check inter 5s fall 3 rise 2 weight 100

# FFXI Login Auth Port (54231) - Session persistence required
frontend ffxi_login_auth_frontend
    bind *:54231
    mode tcp
    option tcplog
    default_backend ffxi_login_auth_backend

backend ffxi_login_auth_backend
    mode tcp
    balance source
    hash-type consistent
    option tcp-check
    tcp-check connect port 54241
    
    server ffxi-server-1 ffxi-server-1:54241 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:54251 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-3 ffxi-server-3:54261 check inter 5s fall 3 rise 2 weight 100

# FFXI Login Config Port (51220) - Round Robin
frontend ffxi_login_conf_frontend
    bind *:51220
    mode tcp
    option tcplog
    default_backend ffxi_login_conf_backend

backend ffxi_login_conf_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect port 51230
    
    server ffxi-server-1 ffxi-server-1:51230 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:51240 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-3 ffxi-server-3:51250 check inter 5s fall 3 rise 2 weight 100

# FFXI Search Port (54002) - Round Robin with failover
frontend ffxi_search_frontend
    bind *:54002
    mode tcp
    option tcplog
    default_backend ffxi_search_backend

backend ffxi_search_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect port 54012
    
    server ffxi-server-1 ffxi-server-1:54012 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:54022 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-3 ffxi-server-3:54032 check inter 5s fall 3 rise 2 weight 100

# FFXI ZMQ Port (54003) - Least connections for message queue
frontend ffxi_zmq_frontend
    bind *:54003
    mode tcp
    option tcplog
    default_backend ffxi_zmq_backend

backend ffxi_zmq_backend
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect port 54013
    
    server ffxi-server-1 ffxi-server-1:54013 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:54023 check inter 5s fall 3 rise 2 weight 100
    server ffxi-server-3 ffxi-server-3:54033 check inter 5s fall 3 rise 2 weight 100

# FFXI HTTP Management Port (8088) - Round Robin
frontend ffxi_http_frontend
    bind *:8088
    mode http
    option httplog
    default_backend ffxi_http_backend

backend ffxi_http_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    server ffxi-server-1 ffxi-server-1:8089 check inter 10s fall 3 rise 2 weight 100
    server ffxi-server-2 ffxi-server-2:8090 check inter 10s fall 3 rise 2 weight 100
    server ffxi-server-3 ffxi-server-3:8091 check inter 10s fall 3 rise 2 weight 100

#=============================================================================
# Advanced Load Balancing Rules
#=============================================================================

# Rate limiting for login attempts (prevent brute force)
frontend ffxi_rate_limit
    bind *:54299
    mode tcp
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_http_req_rate(0) gt 20 }
    default_backend ffxi_login_view_backend

# Maintenance mode configuration
frontend ffxi_maintenance
    bind *:54998
    mode http
    http-request return status 503 content-type "text/plain" string "FFXI Server under maintenance"

# Connection monitoring and logging
listen ffxi_monitor
    bind *:8406
    mode http
    stats enable
    stats uri /monitor
    stats refresh 5s
    stats admin if TRUE
    stats show-legends
    stats show-node
    option httplog

# Custom error pages for FFXI-specific errors
backend ffxi_error_503
    mode http
    http-request return status 503 content-type "text/html" file /usr/local/etc/haproxy/errors/ffxi-503.html

backend ffxi_error_502
    mode http
    http-request return status 502 content-type "text/html" file /usr/local/etc/haproxy/errors/ffxi-502.html