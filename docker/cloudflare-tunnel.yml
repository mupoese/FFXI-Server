# Cloudflare Tunnel Configuration for FFXI Server
# This file will be dynamically generated by entrypoint.sh

# Note: Cloudflare Tunnels primarily support HTTP/HTTPS traffic
# For FFXI game traffic (which uses UDP), you may need to:
# 1. Use Cloudflare Spectrum for UDP traffic (requires Enterprise plan)
# 2. Configure TCP fallback for game connections
# 3. Use alternative solutions like WireGuard or direct connections

tunnel: ffxi-server
credentials-file: /opt/ffxi/.cloudflared/tunnel.json

# Ingress rules for different FFXI services
ingress:
  # HTTP Management Interface
  - hostname: admin.example.com
    service: http://localhost:8088
    
  # FFXI Login Services (TCP)
  - hostname: login.example.com
    service: tcp://localhost:54001
    
  # FFXI Authentication (TCP)  
  - hostname: auth.example.com
    service: tcp://localhost:54231
    
  # FFXI Configuration (TCP)
  - hostname: config.example.com
    service: tcp://localhost:51220
    
  # FFXI Search Service (TCP)
  - hostname: search.example.com
    service: tcp://localhost:54002
    
  # Catch-all rule
  - service: http_status:404

# Additional configuration options
originRequest:
  connectTimeout: 30s
  tcpKeepAlive: 30s
  noHappyEyeballs: false
  keepAliveConnections: 100
  keepAliveTimeout: 1m30s
  httpHostHeader: ""
  originServerName: ""
  caPool: ""
  noTLSVerify: false
  disableChunkedEncoding: false
  bastionMode: false
  proxyAddress: "127.0.0.1:0"
  proxyPort: 0
  proxyType: ""

# Metrics and logging
metrics: localhost:2000
loglevel: info