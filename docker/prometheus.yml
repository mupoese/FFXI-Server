# Prometheus Configuration for FFXI Server Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "ffxi-server"
    static_configs:
      - targets: ["ffxi-server:8088"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "mysql"
    static_configs:
      - targets: ["db:3306"]
    scrape_interval: 30s