[supervisord]
nodaemon=true
logfile=/opt/ffxi/logs/supervisord.log
pidfile=/opt/ffxi/supervisord.pid
user=ffxi

[program:ffxi-connect]
command=/opt/ffxi/bin/xi_connect
directory=/opt/ffxi
user=ffxi
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/opt/ffxi/logs/connect.log
stderr_logfile=/opt/ffxi/logs/connect_error.log
environment=LD_LIBRARY_PATH="/opt/ffxi/lib"

[program:ffxi-search]
command=/opt/ffxi/bin/xi_search
directory=/opt/ffxi
user=ffxi
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/opt/ffxi/logs/search.log
stderr_logfile=/opt/ffxi/logs/search_error.log
environment=LD_LIBRARY_PATH="/opt/ffxi/lib"

[program:ffxi-map]
command=/opt/ffxi/bin/xi_map
directory=/opt/ffxi
user=ffxi
autostart=true
autorestart=true
startsecs=15
startretries=3
stdout_logfile=/opt/ffxi/logs/map.log
stderr_logfile=/opt/ffxi/logs/map_error.log
environment=LD_LIBRARY_PATH="/opt/ffxi/lib"
priority=100

[program:ffxi-world]
command=/opt/ffxi/bin/xi_world
directory=/opt/ffxi
user=ffxi
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/opt/ffxi/logs/world.log
stderr_logfile=/opt/ffxi/logs/world_error.log
environment=LD_LIBRARY_PATH="/opt/ffxi/lib"

[group:ffxi-servers]
programs=ffxi-connect,ffxi-search,ffxi-map,ffxi-world
priority=999