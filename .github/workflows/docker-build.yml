name: "Docker Build and Push"

on:
  push:
    branches:
      - main
      - base
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - base
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ffxi-server

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan Docker image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          fail-build: false
          severity-cutoff: high

  docker-test:
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ffxi-server:test
          cache-from: type=gha

      - name: Test Docker container
        run: |
          # Start services in background
          docker-compose -f docker-compose.yml up -d db
          
          # Wait for database to be ready
          timeout 60 bash -c 'until docker-compose exec -T db mysqladmin ping -h localhost --silent; do sleep 2; done'
          
          # Test FFXI server container
          docker run --rm --network container:ffxi-database \
            -e FFXI_SQL_HOST=localhost \
            -e FFXI_SQL_PASSWORD=xiserver \
            ffxi-server:test /bin/bash -c "
              # Test database connection
              mysqladmin ping -h localhost -u root -pxiserver --silent
              
              # Test binary existence
              ls -la /opt/ffxi/bin/ || echo 'Binaries not found - this is expected if build failed'
              
              # Test configuration
              ls -la /opt/ffxi/settings/
              
              echo 'Container tests completed'
            "

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v
          docker system prune -f